<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Колесо фортуны</title>
<style>
  :root {
    --bg: #0b0e1a;
    --card: #161c2e;
    --card-2: #1c2438;
    --border: #2a3350;
    --text: #e7e9f3;
    --muted: #9aa3bd;
    --accent: #7c5cff;
    --accent-hover: #6a4df0;
    --danger: #ef4444;
    --ok: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #1a2140 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 20px 60px;
  }
  header { text-align: center; margin-bottom: 26px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  main {
    display: grid;
    gap: 22px;
    max-width: 960px;
    margin: 0 auto;
    justify-content: center;
    grid-template-columns: 1fr;
  }
  @media (min-width: 820px) {
    main { grid-template-columns: minmax(320px, 520px) minmax(300px, 400px); align-items: start; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  .card h2 { margin: 0 0 4px; font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .hint { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.45; }

  /* Wheel */
  .wheel-col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .wheel-wrap { position: relative; width: 100%; max-width: 480px; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 3;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 28px solid #fff;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.55));
  }
  #wheelSvg { display: block; width: 100%; height: auto; user-select: none; }
  #wheel { transform-origin: 250px 250px; will-change: transform; }
  .hub { fill: #0f1322; stroke: var(--border); stroke-width: 2; }

  .spin {
    font-size: 18px; font-weight: 700; letter-spacing: .5px;
    padding: 13px 38px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    color: #fff; cursor: pointer;
    box-shadow: 0 8px 22px rgba(124,92,255,.45);
    transition: transform .1s ease, opacity .2s ease;
  }
  .spin:hover:not(:disabled) { transform: translateY(-1px); }
  .spin:active:not(:disabled) { transform: translateY(0); }
  .spin:disabled { opacity: .45; cursor: not-allowed; }

  #notice { min-height: 20px; font-size: 13px; color: var(--ok); text-align: center; }

  .result-card { width: 100%; text-align: center; }
  .result-label { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .result-value { font-size: 26px; font-weight: 800; margin-top: 4px; line-height: 1.25; }

  /* Controls */
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type="text"], input[type="number"], select {
    background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .add-row input { flex: 1; }
  button.small {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  button.small:hover { background: var(--accent-hover); }

  #segList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #segList li {
    display: flex; align-items: center; gap: 8px;
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px;
  }
  #segList .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  #segList .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  #segList .del {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px;
  }
  #segList .del:hover { color: var(--danger); background: rgba(239,68,68,.12); }

  #titleInput { font-size: 15px; font-weight: 600; }

  .actions { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .actions button {
    background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; cursor: pointer; font-size: 13px;
  }
  .actions button:hover { border-color: var(--accent); }
  .actions button.danger { color: #fda4af; }
  .actions button.danger:hover { border-color: var(--danger); }

  /* Cat fireworks */
  #fireworks { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
  .cat {
    position: absolute;
    transform: translate(-50%, -50%);
    animation: catfly var(--dur) cubic-bezier(0.2, 0.6, 0.35, 1) forwards;
    will-change: transform, opacity;
  }
  @keyframes catfly {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(0.3); opacity: 1; }
    50%  { transform: translate(-50%, -50%) translate(var(--midx), var(--peak)) rotate(var(--midrot)) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--dx), var(--y)) rotate(var(--rot)) scale(1.35); opacity: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="titleText">🎡 Колесо фортуны</h1>
  <p>Крутите колесо — выпадет ведущий дня.</p>
</header>

<main>
  <section class="wheel-col">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <svg id="wheelSvg" viewBox="0 0 500 500">
        <circle cx="250" cy="250" r="246" fill="none" stroke="#0d1120" stroke-width="9"></circle>
        <g id="wheel"></g>
        <circle cx="250" cy="250" r="24" class="hub"></circle>
      </svg>
    </div>
    <button id="spinBtn" class="spin">Крутить</button>
    <div id="notice"></div>
    <div class="card result-card">
      <div class="result-label">Результат</div>
      <div class="result-value" id="resultValue">Крутите колесо</div>
    </div>
  </section>

  <section class="card">
    <h2>Заголовок</h2>
    <div class="add-row">
      <input type="text" id="titleInput" maxlength="80" />
    </div>
    <h2>Участники</h2>
    <p class="hint">Список в порядке ротации — каждый ведёт ровно один раз за круг.</p>
    <div class="add-row">
      <input type="text" id="newName" placeholder="Имя участника" maxlength="60" />
      <button class="small" id="addBtn">Добавить</button>
    </div>
    <ul id="segList"></ul>

    <div class="actions">
      <button id="resetAll" class="danger">Сбросить всё</button>
    </div>
  </section>
</main>

<div id="fireworks"></div>

<script>
(function () {
  "use strict";

  var CX = 250, CY = 250, R = 240;
  var PALETTE = [
    "#ef4444", "#f97316", "#f59e0b", "#84cc16", "#22c55e", "#10b981",
    "#06b6d4", "#3b82f6", "#8b5cf6", "#d946ef", "#ec4899", "#f43f5e"
  ];
  var STORAGE_KEY = "wheel-fortune-v4";

  // Порядок ротации: Алим (пн 2026-11-09) -> Яна (ср) -> ... дальше по кругу.
  var DEFAULT_SEGMENTS = [
    "Алим Жашуев", "Яна Елисеева", "Александр Романенко", "Леонид Зарков",
    "Егор Шостак", "Данила Дерявко", "Федор Павличенко", "Андрей Ружанский",
    "Николай Климачев", "Владимир Скаринов", "Михаил Бахов", "Александр Шмаков",
    "Дмитрий Добрецков", "Данила Пачев", "Павел Муханов", "Александр Пеньков"
  ];

  // Дейли: понедельник, среда, пятница.
  var DAILY_DAYS = { 1: true, 3: true, 5: true };
  var DAY_LABEL = { 1: "понедельник", 3: "среду", 5: "пятницу" };
  var EPOCH = new Date(2026, 10, 9); // понедельник 2026-11-09 = Алим (index 0)

  function defaultState() {
    return {
      title: "🎡 Колесо фортуны",
      segments: DEFAULT_SEGMENTS.slice()
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.segments) && d.segments.length) {
          return { title: d.title || defaultState().title, segments: d.segments };
        }
      }
    } catch (e) { /* ignore */ }
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var state = load();
  var currentRotation = 0;
  var isSpinning = false;
  var highlightIndex = null;

  var el = {
    wheel: document.getElementById("wheel"),
    spinBtn: document.getElementById("spinBtn"),
    notice: document.getElementById("notice"),
    newName: document.getElementById("newName"),
    addBtn: document.getElementById("addBtn"),
    segList: document.getElementById("segList"),
    resultValue: document.getElementById("resultValue"),
    titleInput: document.getElementById("titleInput"),
    titleText: document.getElementById("titleText"),
    resetAll: document.getElementById("resetAll")
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toRad(d) { return d * Math.PI / 180; }
  function pt(deg, r) {
    var a = toRad(deg);
    return { x: CX + r * Math.sin(a), y: CY - r * Math.cos(a) };
  }

  function slicePath(i, n) {
    var sa = i * (360 / n), ea = (i + 1) * (360 / n);
    var p0 = pt(sa, R), p1 = pt(ea, R);
    var large = (ea - sa) > 180 ? 1 : 0;
    return "M " + CX + " " + CY +
      " L " + p0.x.toFixed(2) + " " + p0.y.toFixed(2) +
      " A " + R + " " + R + " 0 " + large + " 1 " + p1.x.toFixed(2) + " " + p1.y.toFixed(2) +
      " Z";
  }

  function shortLabel(s) { return s.length > 16 ? s.slice(0, 15) + "…" : s; }

  // --- Дата и ротация ---
  function getTargetDate() {
    // Если сегодня дейли (Пн/Ср/Пт) — берём сегодня; иначе ближайший следующий дейли.
    var now = new Date();
    var offset = { 0: 1, 1: 0, 2: 1, 3: 0, 4: 1, 5: 0, 6: 2 }[now.getDay()];
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
  }

  function dailyIndex(date) {
    // Сколько дейли (Пн/Ср/Пт) прошло после EPOCH (не включая его) до date включительно.
    var count = 0;
    var d = new Date(EPOCH);
    d.setDate(d.getDate() + 1);
    while (d.getTime() <= date.getTime()) {
      if (DAILY_DAYS[d.getDay()]) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }

  function currentWinner() {
    var date = getTargetDate();
    var idx = dailyIndex(date) % state.segments.length;
    return {
      name: state.segments[idx],
      index: idx,
      dayLabel: DAY_LABEL[date.getDay()]
    };
  }

  function caption() {
    var w = currentWinner();
    return "Ведущий на " + w.dayLabel + " " + w.name;
  }

  // --- Отрисовка ---
  function renderWheel(reset) {
    var n = state.segments.length;
    var fontSize = n > 10 ? 11 : (n > 6 ? 14 : 17);
    var labelR = n > 10 ? R * 0.78 : R * 0.66;
    var html = "";
    for (var i = 0; i < n; i++) {
      var color = PALETTE[i % PALETTE.length];
      var mid = i * (360 / n) + (180 / n);
      var lp = pt(mid, labelR);
      var hl = highlightIndex === i;
      html += '<path d="' + slicePath(i, n) + '" fill="' + color + '" stroke="' +
        (hl ? "#ffffff" : "rgba(255,255,255,0.22)") + '" stroke-width="' + (hl ? 5 : 1.5) + '"></path>';
      html += '<text x="' + lp.x.toFixed(1) + '" y="' + lp.y.toFixed(1) + '" font-size="' + fontSize +
        '" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-weight="600" ' +
        'stroke="rgba(0,0,0,0.28)" stroke-width="3" paint-order="stroke">' +
        "<title>" + escapeHtml(state.segments[i]) + "</title>" + escapeHtml(shortLabel(state.segments[i])) + "</text>";
    }
    el.wheel.innerHTML = html;
    if (reset) {
      currentRotation = 0;
      el.wheel.style.transition = "none";
      el.wheel.style.transform = "rotate(0deg)";
      void el.wheel.getBoundingClientRect();
      el.wheel.style.transition = "";
    }
    renderSegList();
    updateSpinButton();
  }

  function renderSegList() {
    var html = "";
    for (var i = 0; i < state.segments.length; i++) {
      html += '<li>' +
        '<span class="swatch" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
        '<span class="name">' + escapeHtml(state.segments[i]) + "</span>" +
        '<button class="del" data-index="' + i + '" title="Удалить">✕</button>' +
        "</li>";
    }
    el.segList.innerHTML = html;
  }

  function updateSpinButton() {
    el.spinBtn.disabled = isSpinning || state.segments.length < 2;
  }

  function showNotice(msg) {
    el.notice.textContent = msg;
    clearTimeout(showNotice._t);
    showNotice._t = setTimeout(function () { el.notice.textContent = ""; }, 3500);
  }

  function applyTitle() {
    el.titleText.textContent = state.title;
    document.title = state.title;
  }

  // --- Фонтан из котиков ---
  function celebrate() {
    var wrap = document.querySelector(".wheel-wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var container = document.getElementById("fireworks");
    var cats = ["🐱", "😺", "😸", "😹", "😻", "🙀", "😼", "😽", "🐈", "😾"];
    var count = 90;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.className = "cat";
      s.textContent = cats[Math.floor(Math.random() * cats.length)];
      var ang = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 340;
      var dx = Math.cos(ang) * dist;
      var peak = -(150 + Math.random() * 320);
      var y = 100 + Math.random() * 380;
      var rot = Math.random() * 720 - 360;
      s.style.left = cx + "px";
      s.style.top = cy + "px";
      s.style.fontSize = (18 + Math.random() * 30) + "px";
      s.style.setProperty("--dx", dx.toFixed(0) + "px");
      s.style.setProperty("--midx", (dx * 0.55).toFixed(0) + "px");
      s.style.setProperty("--peak", peak.toFixed(0) + "px");
      s.style.setProperty("--y", y.toFixed(0) + "px");
      s.style.setProperty("--rot", rot.toFixed(0) + "deg");
      s.style.setProperty("--midrot", (rot * 0.6).toFixed(0) + "deg");
      s.style.setProperty("--dur", (1.3 + Math.random() * 1.2).toFixed(2) + "s");
      container.appendChild(s);
      (function (node) {
        setTimeout(function () { node.remove(); }, 2800);
      })(s);
    }
  }

  // --- Вращение ---
  function spin() {
    if (isSpinning) return;
    var n = state.segments.length;
    if (n < 2) { showNotice("Добавьте минимум двух участников"); return; }

    var w = currentWinner();
    var sliceAngle = 360 / n;
    var mid = (w.index + 0.5) * sliceAngle;
    var curMod = ((currentRotation % 360) + 360) % 360;
    var delta = (360 - ((curMod + mid) % 360)) % 360;
    delta += (Math.random() - 0.5) * sliceAngle * 0.5;
    var finalRotation = currentRotation + 5 * 360 + delta;

    isSpinning = true;
    updateSpinButton();
    el.wheel.style.transition = "transform 4.2s cubic-bezier(0.15, 0.75, 0.15, 1)";
    el.wheel.style.transform = "rotate(" + finalRotation + "deg)";
    currentRotation = finalRotation;

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      isSpinning = false;
      updateSpinButton();
      el.resultValue.textContent = caption();
      highlightIndex = w.index;
      renderWheel(false);
      celebrate();
      setTimeout(function () {
        highlightIndex = null;
        renderWheel(false);
      }, 2500);
    }
    el.wheel.addEventListener("transitionend", finish, { once: true });
    setTimeout(function () { finish(); }, 4700);
  }

  function addSegment() {
    var name = el.newName.value.trim();
    if (!name) return;
    var lower = name.toLowerCase();
    for (var i = 0; i < state.segments.length; i++) {
      if (state.segments[i].toLowerCase() === lower) {
        showNotice("Такой участник уже есть");
        return;
      }
    }
    state.segments.push(name);
    el.newName.value = "";
    save();
    renderWheel(true);
  }

  function removeSegment(index) {
    state.segments.splice(index, 1);
    save();
    renderWheel(true);
  }

  function populateControls() {
    el.titleInput.value = state.title;
    applyTitle();
  }

  el.addBtn.addEventListener("click", addSegment);
  el.newName.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addSegment();
  });
  el.segList.addEventListener("click", function (e) {
    var btn = e.target.closest(".del");
    if (btn) removeSegment(parseInt(btn.getAttribute("data-index"), 10));
  });
  el.spinBtn.addEventListener("click", spin);
  el.titleInput.addEventListener("change", function () {
    state.title = el.titleInput.value.trim() || "🎡 Колесо фортуны";
    applyTitle();
    save();
  });
  el.resetAll.addEventListener("click", function () {
    if (!confirm("Сбросить список участников и заголовок к значениям по умолчанию?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    state = defaultState();
    highlightIndex = null;
    populateControls();
    renderWheel(true);
    el.resultValue.textContent = "Крутите колесо";
  });

  populateControls();
  renderWheel(true);
})();
</script>
</body>
</html>
